# CODEX-GOVERNANCE-MANAGED-WORKFLOW v1
name: Governance Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup governance runner Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Run governed CI verification
        run: >-
          python .governance/run-ci-verification.py
          --project-root .
          --plan verification-plan.json
          --baseline .governance/assurance-baseline.json
          --report .governance/evidence/ci-full.json

      - name: Upload assurance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-assurance-${{ github.run_id }}
          path: .governance/evidence/ci-full.json
          if-no-files-found: warn
          retention-days: 14
