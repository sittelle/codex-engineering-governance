governance:
  baseline: "2.0.0"
  source: "host-adapter-locator"
  locator: "GOVERNANCE_ROOT"

# professional | non-professional. Selects the framework's vocabulary and
# the default routing for decisions that need professional software-
# development and/or security judgment; see "Developer language and
# professional decisions" in global/governance-standard.md and
# docs/adr/0002-developer-language-and-professional-terminology.md. This is
# a self-declared preference, not a security boundary: it lives outside the
# governance: block on purpose, so the coder may change it directly at any
# time, including changing their mind later. It never changes which
# controls apply.
developer_language: "professional"

project:
  name: "<project-name>"
  maturity: "M1"
  # Machine identifier: SA0 | SA1 | SA2 | SA3
  assurance: "SA1"
  lifecycle: "ACTIVE"

# Meaningful only when developer_language is non-professional; the coder
# holds both roles when developer_language is professional and this block
# is left empty there.
roles:
  business_owner: null
  professional: null

# Governed architecture-significant technology state.
# Allowed states: UNESTABLISHED | ESTABLISHED | RECONCILIATION_REQUIRED
technology_baseline:
  state: "UNESTABLISHED"
  record: "docs/design.md#technology-baseline"

platforms:
  development: []
  runtime: []

# Profiles select reusable guidance; they do not define or constrain the approved Technology Baseline.
profiles:
  languages: []
  frameworks: []
  platforms: []
  data: []
  infrastructure: []
  publication: []

verification:
  quick: "<command>"
  full: "<command>"
  plan: "verification-plan.json"
  plan_schema: "2"
  assurance_baseline: ".governance/assurance-baseline.json"
  evidence_directory: ".governance/evidence"
  local_ci_parity_required: true

# Declared, not verified: the SCM platform (GitLab/GitHub) is the actual
# enforcement point. This block records what was configured there so intent
# and evidence stay visible together in the repository; editing it here does
# not change platform behavior, and it is not cross-checked against the
# platform's actual settings.
platform_controls:
  protected_branch: null
  merge_request_required: false
  required_governance_check: false
  force_push_disabled: false

security:
  threat_model_required: false
  sbom_required: false
  dast_required: false
  critical_release_blocker: true
  high_release_blocker: true

documentation:
  design: "docs/design.md"
  requirements: null
  architecture: null
  security: null
  adr_directory: "docs/adr"
  risk_register: "docs/risk/accepted-risks.md"

publication:
  intended_public: false
  license_decided: false

exceptions:
  active: []

accepted_risks:
  active: []
