rules:
  - id: capability-network-connections-http-client
    languages: [python]
    severity: INFO
    message: HTTP client usage detected; maps to registration capability network_connections.
    metadata:
      capability: network_connections
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: requests.put(...)
          - pattern: requests.delete(...)
          - pattern: requests.request(...)
          - pattern: requests.Session(...)
          - pattern: httpx.get(...)
          - pattern: httpx.post(...)
          - pattern: httpx.Client(...)
          - pattern: httpx.AsyncClient(...)
          - pattern: urllib.request.urlopen(...)
          - pattern: aiohttp.ClientSession(...)

  - id: capability-network-connections-listener
    languages: [python]
    severity: INFO
    message: Network listener/server usage detected; maps to registration capability network_connections.
    metadata:
      capability: network_connections
    patterns:
      - pattern-either:
          - pattern: socket.socket(...)
          - pattern: http.server.HTTPServer(...)
          - pattern: socketserver.TCPServer(...)
          - pattern: Flask(...)
          - pattern: FastAPI(...)

  - id: capability-persistence-database-driver
    languages: [python]
    severity: INFO
    message: Database driver usage detected; maps to registration capability persistence.
    metadata:
      capability: persistence
    patterns:
      - pattern-either:
          - pattern: import sqlite3
          - pattern: import psycopg2
          - pattern: import pymongo
          - pattern: import pymysql
          - pattern: import redis
          - pattern: import sqlalchemy
          - pattern: from sqlalchemy import $X
          - pattern: sqlalchemy.create_engine(...)

  - id: capability-authentication-code
    languages: [python]
    severity: INFO
    message: Authentication-related code detected; maps to registration capability authentication.
    metadata:
      capability: authentication
    patterns:
      - pattern-either:
          - pattern: import bcrypt
          - pattern: import passlib
          - pattern: import jwt
          - pattern: from flask_login import $X
          - pattern: hashlib.pbkdf2_hmac(...)

  - id: capability-elevated-access-subprocess
    languages: [python]
    severity: INFO
    message: Subprocess/shell execution detected; maps to registration capability elevated_access.
    metadata:
      capability: elevated_access
    patterns:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.Popen(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_output(...)
          - pattern: os.system(...)

  - id: capability-write-or-delete-actions-bulk-delete
    languages: [python]
    severity: INFO
    message: Bulk delete/destructive data operation detected; maps to registration capability write_or_delete_actions.
    metadata:
      capability: write_or_delete_actions
    patterns:
      - pattern-either:
          - pattern: shutil.rmtree(...)
          - pattern: $QUERYSET.objects.all().delete()
          - pattern: $COLLECTION.delete_many(...)
          - pattern: $CURSOR.execute("DELETE FROM ...")

  - id: capability-cloud-sdk
    languages: [python]
    severity: INFO
    message: Cloud provider SDK usage detected; maps to registration capability cloud.
    metadata:
      capability: cloud
    patterns:
      - pattern-either:
          - pattern: import boto3
          - pattern: from google.cloud import $X
          - pattern: import azure.$MODULE
          - pattern: from azure.$MODULE import $X

  - id: capability-external-recipients-outbound-mail
    languages: [python]
    severity: INFO
    message: Outbound mail/messaging usage detected; maps to registration capability external_recipients.
    metadata:
      capability: external_recipients
    patterns:
      - pattern-either:
          - pattern: import smtplib
          - pattern: smtplib.SMTP(...)
          - pattern: smtplib.SMTP_SSL(...)
          - pattern: django.core.mail.send_mail(...)
          - pattern: sendgrid.SendGridAPIClient(...)
